<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="CSS/style.css" type="text/css">
        <title>ExploraZO - Login</title>

    <body>
        <header>
            <img src="imagens/explorazo.png" alt="logo do ExploraZo." width="120px">
            <h1>ExploraZO</h1>
            <a href="login.html" id="login">Login</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="orçamento.html">Orçamento</a>
            <a href="sobre.html">Sobre</a>
            <hr>
        </nav>
        <main>
            <div class="login-container">
                <h2>Entre na sua conta</h2>

                <form>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required><br><br>

                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required minlength="8" maxlength="8"><br><br>

                    

                    <button type="submit">Entrar</button><br><br>
                </form>

                <p class="cadastro">
                    Ainda não tem uma conta?
                    <a href="criarconta.html">Criar conta</a>
                </p>
                <p class="esquecesenha">
                    <a href="#">Esqueci minha senha</a>
                </p>
            </div>
        </main>
