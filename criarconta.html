        <main>
            <section id="principal">
                <h2>Crie sua conta para começar a explorar o mundo!</h2>

                <form method="GET" action="#" enctype="multipart/form-data">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required minlength="15" maxlength="60"><br><br>
 
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required><br><br>

                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required minlength="8" maxlength="8"><br><br>

                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" required><br><br>
                    
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" placeholder="Digite seu telefone" required minlength="11" maxlength="11"><br><br>

                    <label for="genero">Gênero:</label>
                    <input type="radio" id="masculino" name="genero" value="masculino" required>
                    <label for="masculino">Masculino</label>
                    <input type="radio" id="feminino" name="genero" value="feminino" required>
                    <label for="feminino">Feminino</label><br><br>
                    

                    <br><input type="checkbox" id="termos" required>
                    <label for="termos">Aceito os termos e condições</label><br><br>
                    <button type="submit">Criar Conta</button>
                    

                </form>
            </section>
        </main>
